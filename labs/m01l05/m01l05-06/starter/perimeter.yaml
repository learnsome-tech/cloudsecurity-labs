Resources:
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DataVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: [!Ref PrivateRouteTable]
      PolicyDocument:
        Statement:
          - {Effect: Allow, Principal: "*", Action: "s3:*", Resource: "*",
             Condition: {StringEquals: {"aws:ResourceOrgID": o-a1b2c3d4e5}}}
  ExportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExportsBucket
      PolicyDocument:
        Statement:
          - {Sid: OnlyThroughOurEndpoint, Effect: Deny, Principal: "*",
             Action: "s3:*", Resource: !Sub "${ExportsBucket.Arn}/*",
             Condition: {StringNotEquals: {"aws:SourceVpce": !Ref S3Endpoint}}}

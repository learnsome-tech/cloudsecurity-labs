# Cloud Security & DevSecOps Engineering — lesson m06l01 — CloudTrail Logging, Integrity Validation & Athena
# https://learnsome.tech/courses/cloudsecurity-course/watch?lesson=m06l01
# © LearnSome.tech
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # Node noise: kube-proxy watches are not evidence of anything
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  # Secret values must never be written to the log
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  # Who changed RBAC, and exactly to what
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
  # Catch-all: anything unmatched would not be logged at all
  - level: Metadata

name: security-gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets in the new commits
        run: gitleaks git --redact --log-opts="origin/main..HEAD" .
      - name: Code patterns, scanned on main and on this branch
        run: |
          semgrep scan --config p/python --sarif --output pr.sarif
          git checkout -q origin/main
          semgrep scan --config p/python --sarif --output main.sarif
      - name: Gate on new errors only
        run: python3 gate.py main.sarif pr.sarif

# Cloud Security & DevSecOps Engineering — lesson m03l03 — Static Application Security Testing with Semgrep
# https://learnsome.tech/courses/cloudsecurity-course/watch?lesson=m03l03
# © LearnSome.tech
rules:
  - id: sql-built-from-strings
    languages: [python]
    severity: ERROR
    message: >-
      SQL text is built from strings. Pass values as query
      parameters instead, for example cur.execute(sql, (value,))
    metadata:
      cwe: "CWE-89: SQL Injection"
    pattern-either:
      - pattern: $CUR.execute("..." % ...)
      - pattern: $CUR.execute("...".format(...))
      - pattern: $CUR.execute(f"...")
      - patterns:
          - pattern-inside: |
              $SQL = "..." % ...
              ...
          - pattern: $CUR.execute($SQL, ...)

# api-scrape, spec only. Version A: one peer, two selectors
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress:
  - ports: [{port: 8081}]
    from:
    - namespaceSelector: {matchLabels: {team: monitoring}}
      podSelector: {matchLabels: {app: prometheus}}
---
# Version B: the same lines with one extra dash
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress:
  - ports: [{port: 8081}]
    from:
    - namespaceSelector: {matchLabels: {team: monitoring}}
    - podSelector: {matchLabels: {app: prometheus}}

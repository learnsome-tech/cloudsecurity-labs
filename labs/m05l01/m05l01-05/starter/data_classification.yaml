# checkov -d . --external-checks-dir custom_checks
metadata:
  id: "CKV2_CUSTOM_1"
  name: "Storage must carry an agreed data_classification tag"
  category: "GENERAL_SECURITY"
definition:
  and:
    - cond_type: "attribute"
      resource_types: ["aws_s3_bucket", "aws_db_instance", "aws_ebs_volume"]
      attribute: "tags.data_classification"
      operator: "exists"
    - cond_type: "attribute"
      resource_types: ["aws_s3_bucket", "aws_db_instance", "aws_ebs_volume"]
      attribute: "tags.data_classification"
      operator: "within"
      value: ["public", "internal", "confidential", "restricted"]

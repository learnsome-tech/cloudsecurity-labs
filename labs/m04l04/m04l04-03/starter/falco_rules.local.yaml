# /etc/falco/falco_rules.local.yaml: loaded after falco_rules.yaml
- list: web_server_binaries_local
  items: [nginx, gunicorn, uwsgi, node, java]

- rule: Shell spawned by web server
  desc: A web server process started a shell, a sign of command injection
  condition: >
    spawned_process and container and shell_procs
    and proc.pname in (web_server_binaries_local)
  output: Shell under web server (parent=%proc.pname
    cmdline=%proc.cmdline pod=%k8s.pod.name)
  priority: WARNING
  tags: [container, shell, mitre_execution]

- rule: Service account token read by unexpected process
  desc: Something other than the app opened the pod's API token
  condition: >
    open_read and container and not proc.name in (web_server_binaries_local)
    and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount
  output: Token read (proc=%proc.name file=%fd.name pod=%k8s.pod.name)
  priority: ERROR
  tags: [container, mitre_credential_access]
